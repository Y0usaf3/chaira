[workspace]
resolver = "3"
exclude = ["charli"]
members = ["models", "service", "service-macros"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = 'abort'
strip = true

[workspace.dependencies]
surrealdb = {version = "3.1.0-beta.3", features = ["kv-mem", "scripting"]}
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }
surrealdb-types = "3.1.0-beta.3"
axum = "0.8.9"
serde_json = "1.0.149"
validator = "0.20.0"
serde = "1.0.228"
chrono = { version = "0.4.44", features = [ "serde" ] }
sha2 ="0.11.0"
hex = "0.4.3"
redis = { version="1.2.2", features = ["tokio-native-tls-comp", "tokio-comp", "json"] }
